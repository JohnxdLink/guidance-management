<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Britech College</title>

    <link rel="stylesheet" href="../assets/css/style.css">

</head>


<body class="bg-light">


    <!--  LOGIN PAGE  -->

    <main
        class="d-flex items-center justify-center position-relative h-100 p-8">


        <!-- Decorative Background -->

        <div
            class="position-absolute top-0 right-0 bg-warning radius-full">
        </div>


        <!--  LOGIN CARD  -->

        <section
            class="bg-white radius-2xl shadow-xl p-12 w-50 position-relative">


            <!--  LOGO  -->

            <div
                class="d-flex flex-column items-center justify-center mb-12">

                <!-- Britech Logo Circle -->

                <div
                    class="d-flex items-center justify-center w-30 h-30">
                    <a href="../index.html">

                        <img
                         src="../assets/images/logo/britech-logo.png" alt="Britech College">
                        
                    </a>
                </div>


                <h1
                    class="text-3xl font-bold text-primary mt-4">

                    Britech

                </h1>


                <p class="text-md text-gray">
                    College
                </p>

            </div>



            <!--  LOGIN FORM  -->

            <form>


                <!-- Username -->

                <div class="mb-6">

                    <label
                        for="username"
                        class="d-block text-md font-semibold text-dark mb-3">

                        Login

                    </label>


                    <div
                        class="d-flex items-center border-1 border-light-gray radius-lg overflow-hidden">

                        <div
                            class="bg-warning p-4">

                            👤

                        </div>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            class="border-0 p-4 w-100 text-md">

                    </div>

                </div>



                <!-- Password -->

                <div class="mb-4">

                    <label
                        for="password"
                        class="d-block text-md font-semibold text-dark mb-3">

                        Password

                    </label>


                    <div
                        class="d-flex items-center border-1 border-light-gray radius-lg overflow-hidden">

                        <div
                            class="bg-warning p-4">

                            🔒

                        </div>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            class="border-0 p-4 w-100 text-md">

                    </div>

                </div>



                <!-- Forgot Password -->

                <div class="d-flex justify-end mb-8">

                    <a
                        href="#"
                        class="text-primary text-sm font-semibold">

                        Forgot Password?

                    </a>

                </div>



                <!-- Login Button -->

                <button
                    type="submit"
                    class="bg-primary text-white border-0 radius-lg p-4 w-100 text-lg font-bold">

                    Log In

                </button>


            </form>


        </section>



        <!--  DECORATIVE BOTTOM  -->

        <div
            class="position-absolute bottom-0 left-0 w-100 d-flex justify-center">

            <div
                class="bg-warning radius-2xl w-75 h-80">
            </div>

        </div>


    </main>

</body>

</html>
